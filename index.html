<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KRYSTAPLY CLUB SHIELD™ | Architectural Ply Composites</title>
    <meta name="description" content="Engineered Architectural Plywood & Strata Composite Solutions for Architects, Specifiers, and Modern Joinery." />
    <meta property="og:title" content="KRYSTAPLY CLUB SHIELD™ | Architectural Ply Composites" />
    <meta property="og:description" content="Engineered Architectural Plywood & Strata Composite Solutions for Architects, Specifiers, and Modern Joinery." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body class="bg-[#121314] text-[#e3e2e3] selection:bg-[#d91e18] selection:text-[#ffefed] antialiased">
    <div id="root"></div>

    <!--
      Hidden static form so Netlify's build-time bot can detect and register
      the "boq-quote" form. Netlify Forms scans the deployed static HTML for
      forms at build time, which a pure React/SPA form is invisible to — this
      stub is what makes real submissions from BOQQuoteSection.tsx actually
      get delivered. Do not remove, even though it's never rendered visibly.
    -->
    <form name="boq-quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="city" />
      <input type="text" name="clientType" />
      <input type="text" name="product" />
      <input type="text" name="quantity" />
      <textarea name="notes"></textarea>
      <input type="file" name="attachment" />
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
